<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Class - {{ school_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>

<body>
    <div class="center-screen">
        <div class="glass-panel container-narrow">
            <h1 style="text-align: center;">💰 Bill Entire Class</h1>

            <div class="alert alert-warning" style="text-align: center;">
                ⚠️ This adds the amount to <b>every student</b> in the selected class.
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST">

                <div class="form-group">
                    <label>Select Class</label>
                    <select name="class" required>
                        <option value="" disabled selected>Select Class</option>
                        {% for c in classes %}
                        <option value="{{ c }}">{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Amount to Add (₦)</label>
                    <input type="number" name="amount" placeholder="e.g. 5000" min="1" required>
                </div>

                <div class="form-group">
                    <label>Reason / Description</label>
                    <input type="text" name="reason" placeholder="e.g. Excursion Fee" required>
                </div>

                <button type="submit" class="btn btn-warning">Apply Charges</button>
            </form>

            <a href="/dashboard/{{ school_id }}" class="back-link">Back to Dashboard</a>
        </div>
    </div>
</body>

</html>
