<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ school_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>

<body>
    <div class="center-screen">
        <div class="container-narrow">
            <div class="glass-panel" style="text-align: center;">
                <h1>🔒 access secured</h1>
                <p class="subtitle">{{ school_name }}</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}" style="color: #fca5a5;">{{ message }}</div>
                {% endfor %}
                {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="form-group">
                        <input type="password" name="pin" placeholder="Enter Admin Linkage PIN"
                            style="text-align: center; letter-spacing: 5px; font-size: 1.2em;" autofocus required>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Initialize Dashboard
                    </button>

                    <div style="margin-top: 20px;">
                        <a href="/forgot-pin/{{ school_id }}"
                            style="font-size: 0.85em; color: var(--accent-teal);">Reset Credentials</a>
                    </div>

                    <div style="margin-top: 30px; border-top: 1px solid var(--glass-border); padding-top: 20px;">
                        <a href="/" class="back-link">← Return to Portal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
