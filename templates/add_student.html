<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - {{ school_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>

<body>
    <div class="center-screen">
        <div class="glass-panel container-narrow">
            <h1 style="text-align: center;">👤 Add New Student</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label>Student ID (e.g. ST-001)</label>
                    <input type="text" name="student_id" placeholder="Unique ID" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Surname</label>
                        <input type="text" name="surname" placeholder="Last Name" required>
                    </div>
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" name="first_name" placeholder="First Name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Other Name (Optional)</label>
                    <input type="text" name="other_name" placeholder="Middle Name">
                </div>

                <div class="form-group">
                    <label>Class</label>
                    <select name="student_class" required>
                        <option value="" disabled selected>Select Class</option>
                        {% for c in classes %}
                        <option value="{{ c }}">{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Parent Name</label>
                    <input type="text" name="parent_name" placeholder="Full Parent Name" required>
                </div>

                <div class="form-group">
                    <label>Parent Phone</label>
                    <input type="text" name="parent_phone" placeholder="e.g. 08012345678" required>
                </div>

                <div class="form-group">
                    <label>Total Fees (₦)</label>
                    <input type="number" name="total_fees" placeholder="e.g. 50000" required>
                </div>

                <button type="submit" class="btn btn-primary">Add Student</button>
            </form>

            <a href="/dashboard/{{ school_id }}" class="back-link">Back to Dashboard</a>
        </div>
    </div>
</body>

</html>
